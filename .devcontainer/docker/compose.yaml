name: devcontainerex
services:
  development:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ${HOME}/.claude:/home/development/.claude
      - ${HOME}/.claude.json:/home/development/.claude.json
      - ../claude/settings.json:/home/development/.claude/settings.json
      - ../..:/devcontainerex
    command: sleep infinity
